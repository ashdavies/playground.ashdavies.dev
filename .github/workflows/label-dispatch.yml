name: Label Dispatch

on:
  pull_request:
    types: [ labeled ]

jobs:
  terraform_apply:
    if: github.event.label.name == 'Terraform Apply'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: |
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh workflow run terraform-apply.yml \
            -f pr_number="${{ github.event.pull_request.number }}" \
            --ref "${{ github.event.pull_request.head.ref }}"
