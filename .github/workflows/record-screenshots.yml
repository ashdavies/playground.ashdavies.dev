name: Record Screenshots

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  record_screenshots_main:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: 'true'

      - uses: ./.github/actions/setup-java

      - uses: gradle/actions/setup-gradle@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_ID }}

      - run: echo ${{ secrets.FIREBASE_GOOGLE_SERVICES }} | base64 --decode > android-app/google-services.json

      - run: ./gradlew recordPaparazziDebug --console=plain

      - uses: peter-evans/create-pull-request@v8
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          commit-message: "chore: record screenshots"
          branch: "chore/record-screenshots"
