name: Update Fixtures

on:
  schedule:
    - cron: "0 8 * * 1"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update_fixtures_main:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_ID }}

      - id: app_check
        run: |
          token=$(./scripts/create_app_check_token.mjs "${{ secrets.DESKTOP_APP_ID }}")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - run: |
          curl --fail --silent --show-error --location \
            -H "X-Api-Key: ${{ secrets.DESKTOP_API_KEY }}" \
            -H "X-Firebase-AppCheck: ${{ steps.app_check.outputs.token }}" \
            https://api.ashdavies.dev/events/upcoming \
            | jq --indent 2 . > fixtures/events/fixtures/upcoming.json

      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./scripts/github_pull_request.sh \
            --base-branch "${{ github.head_ref || github.ref_name }}" \
            --commit-msg "chore: update upcoming events fixture"
