name: Android Release

on:
  workflow_call:
    inputs:
      version_code:
        required: true
        type: string
      version_name:
        required: true
        type: string

    secrets:
      ANDROID_API_KEY:
        required: true
      BROWSER_API_KEY:
        required: true
      FASTLANE_SERVICE_ACCOUNT_KEY:
        required: true
      FIREBASE_GOOGLE_SERVICES:
        required: true
      GOOGLE_SERVICE_ACCOUNT_ID:
        required: true
      KEYSTORE_FILE:
        required: true
      KEYSTORE_PASSWORD:
        required: true
      WORKLOAD_IDENTITY_PROVIDER:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-java

      - uses: gradle/actions/setup-gradle@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_ID }}

      - run: |
          echo ${{ secrets.FIREBASE_GOOGLE_SERVICES }} | base64 --decode > android-app/google-services.json
          echo ${{ secrets.KEYSTORE_FILE }} | base64 --decode > android-app/android.keystore

      - run: |
          ./gradlew :android-app:assemble :android-app:bundle \
            -PversionCode=${{ inputs.version_code }} \
            -PversionName=${{ inputs.version_name }} \
            --console=plain
        env:
          ANDROID_API_KEY: ${{ secrets.ANDROID_API_KEY }}
          BROWSER_API_KEY: ${{ secrets.BROWSER_API_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: android-app-build-outputs
          path: android-app/build/outputs
          if-no-files-found: error
