name: Terraform Apply

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  terraform_apply_main:
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-java

      - uses: gradle/actions/setup-gradle@v6

      - uses: 1password/install-cli-action@v4

      - id: google-cloud-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_ID }}
          token_format: access_token

      - name: Docker Auth
        uses: docker/login-action@v4
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.google-cloud-auth.outputs.access_token }}

      - run: |
          ./gradlew cloud-run:deploy \
            -Pimage=europe-west1-docker.pkg.dev/${{ steps.google-cloud-auth.outputs.project_id }}/cloud-run-source-deploy/api.ashdavies.dev \
            -Pversion.name=$(git rev-parse --short HEAD) \
            --no-configuration-cache \
            --console=plain
        env:
          PROJECT_NUMBER: ${{ secrets.PROJECT_NUMBER }}

      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.9

      - run: terraform -chdir=terraform init

      - env:
          TF_VAR_op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TF_VAR_gh_token: ${{ steps.app-token.outputs.token }}
          TF_INPUT: false
        run: terraform -chdir=terraform apply -auto-approve -lock-timeout=5m
