<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playground: Conference App</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { initializeAppCheck, ReCaptchaV3Provider, getToken } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app-check.js";

        const res = await fetch('/__/firebase/init.json');
        const config = await res.json();

        // self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;
        const appCheck = initializeAppCheck(initializeApp(config), {
          provider: new ReCaptchaV3Provider('6Le4n7ItAAAAAOKLcOA5zinjPnoEXBszNjBgT_VJ'),
          isTokenAutoRefreshEnabled: true
        });

        window.getAppCheckToken = (forceRefresh) => getToken(appCheck, forceRefresh);

        try {
          const token = await getToken(appCheck);
          const script = document.createElement('script');
          script.src = "conference-app.js";
          document.body.appendChild(script);
        } catch (err) {
          console.error('Failed to initialize App Check before loading app:', err);
        }
    </script>
</head>
<body>
</body>
</html>
